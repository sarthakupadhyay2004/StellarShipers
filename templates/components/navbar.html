<header class="sticky top-0 z-40 bg-[#1E2328]/95 backdrop-blur-md border-b border-[#353B44]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-20">
            <!-- Brand Logo -->
            <a href="{% url 'pages:home' %}" class="flex items-center space-x-3 group py-1">
                <img src="/static/img/logo.png" alt="STELLAR SHIPERS" class="h-12 sm:h-14 w-auto object-contain rounded shadow-sm group-hover:opacity-95 transition-opacity">
            </a>

            <!-- Desktop Navigation -->
            <nav class="hidden lg:flex items-center space-x-7 text-xs uppercase tracking-wider font-medium text-slate-300">
                <a href="{% url 'pages:home' %}" class="transition-colors {% if request.resolver_match.url_name == 'home' %}text-white font-bold{% else %}hover:text-white{% endif %}">Home</a>
                <a href="{% url 'pages:about' %}" class="transition-colors {% if request.resolver_match.url_name == 'about' %}text-white font-bold{% else %}hover:text-white{% endif %}">About Us</a>
                <a href="{% url 'products:list' %}" class="transition-colors {% if request.resolver_match.app_name == 'products' %}text-white font-bold{% else %}hover:text-white{% endif %}">Products</a>
                <a href="{% url 'pages:quality_process' %}" class="transition-colors {% if request.resolver_match.url_name == 'quality_process' %}text-white font-bold{% else %}hover:text-white{% endif %}">Quality & Process</a>
                <a href="{% url 'pages:services' %}" class="transition-colors {% if request.resolver_match.url_name == 'services' %}text-white font-bold{% else %}hover:text-white{% endif %}">Sourcing Services</a>
                <a href="{% url 'pages:faq' %}" class="transition-colors {% if request.resolver_match.url_name == 'faq' %}text-white font-bold{% else %}hover:text-white{% endif %}">FAQ</a>
                <a href="{% url 'pages:contact' %}" class="transition-colors {% if request.resolver_match.url_name == 'contact' %}text-white font-bold{% else %}hover:text-white{% endif %}">Contact</a>
            </nav>

            <!-- Actions: Primary RFQ & Theme Toggle -->
            <div class="hidden md:flex items-center space-x-3">
                <!-- RFQ Action -->
                <a href="{% url 'rfq:submit' %}" class="metallic-silver-btn px-5 py-2.5 rounded text-xs uppercase tracking-widest font-semibold flex items-center space-x-2 shadow-sm">
                    <span>Request Quote</span>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </a>

                <!-- Theme Switcher (Light / Dark) -->
                <button type="button" class="theme-toggle-btn flex items-center bg-[#161A1E] border border-[#353B44] hover:border-[#4A5563] rounded-full p-1 transition-colors text-xs focus:outline-none focus:ring-1 focus:ring-blue-500" title="Switch Theme" aria-label="Toggle Theme">
                    <span class="theme-opt-light flex items-center justify-center w-7 h-7 rounded-full bg-blue-600 text-white shadow-sm transition-all" title="Light Theme">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    </span>
                    <span class="theme-opt-dark flex items-center justify-center w-7 h-7 rounded-full text-slate-400 hover:text-slate-200 transition-all" title="Dark Theme">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </span>
                </button>
            </div>

            <!-- Mobile Hamburger Button & Quick Theme Toggle -->
            <div class="flex items-center space-x-2 lg:hidden">
                <button type="button" class="theme-toggle-btn flex items-center bg-[#161A1E] border border-[#353B44] rounded-full p-1 text-xs" aria-label="Toggle Theme">
                    <span class="theme-opt-light flex items-center justify-center w-6 h-6 rounded-full bg-blue-600 text-white shadow-sm transition-all">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    </span>
                    <span class="theme-opt-dark flex items-center justify-center w-6 h-6 rounded-full text-slate-400 transition-all">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </span>
                </button>
                <button id="mobile-menu-btn" type="button" class="p-2 rounded text-slate-400 hover:text-white hover:bg-slate-800 focus:outline-none" aria-label="Toggle navigation">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Drawer -->
    <div id="mobile-menu-drawer" class="hidden lg:hidden bg-[#1E2328] border-b border-[#353B44] px-4 pt-2 pb-6 space-y-3">
        <a href="{% url 'pages:home' %}" class="block py-2 text-sm {% if request.resolver_match.url_name == 'home' %}text-white font-bold{% else %}text-slate-300 hover:text-white font-medium{% endif %} border-b border-slate-800/60">Home</a>
        <a href="{% url 'pages:about' %}" class="block py-2 text-sm {% if request.resolver_match.url_name == 'about' %}text-white font-bold{% else %}text-slate-300 hover:text-white font-medium{% endif %} border-b border-slate-800/60">About Us</a>
        <a href="{% url 'products:list' %}" class="block py-2 text-sm {% if request.resolver_match.app_name == 'products' %}text-white font-bold{% else %}text-slate-300 hover:text-white font-medium{% endif %} border-b border-slate-800/60">Products Catalogue</a>
        <a href="{% url 'pages:quality_process' %}" class="block py-2 text-sm {% if request.resolver_match.url_name == 'quality_process' %}text-white font-bold{% else %}text-slate-300 hover:text-white font-medium{% endif %} border-b border-slate-800/60">Quality & Process</a>
        <a href="{% url 'pages:services' %}" class="block py-2 text-sm {% if request.resolver_match.url_name == 'services' %}text-white font-bold{% else %}text-slate-300 hover:text-white font-medium{% endif %} border-b border-slate-800/60">Sourcing Services</a>
        <a href="{% url 'pages:faq' %}" class="block py-2 text-sm {% if request.resolver_match.url_name == 'faq' %}text-white font-bold{% else %}text-slate-300 hover:text-white font-medium{% endif %} border-b border-slate-800/60">FAQ</a>
        <a href="{% url 'pages:contact' %}" class="block py-2 text-sm {% if request.resolver_match.url_name == 'contact' %}text-white font-bold{% else %}text-slate-300 hover:text-white font-medium{% endif %} border-b border-slate-800/60">Contact Export Desk</a>
        <div class="pt-2">
            <a href="{% url 'rfq:submit' %}" class="block w-full text-center metallic-silver-btn py-3 rounded text-xs uppercase tracking-wider font-semibold">Request Quotation (RFQ)</a>
        </div>
    </div>
</header>
