<header class="sticky top-0 z-40 bg-[#1E2328]/95 backdrop-blur-md border-b border-[#353B44]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-20">
            <!-- Brand Logo -->
            <a href="{% url 'pages:home' %}" class="flex items-center space-x-3 group py-1">
                <img src="/static/img/logo.png" alt="STELLAR SHIPERS" class="h-12 sm:h-14 w-auto object-contain rounded shadow-sm group-hover:opacity-95 transition-opacity">
            </a>

            <!-- Desktop Navigation -->
            <nav class="hidden lg:flex items-center space-x-7 text-xs uppercase tracking-wider font-medium text-slate-300">
                <a href="{% url 'pages:home' %}" class="hover:text-white transition-colors">Home</a>
                <a href="{% url 'pages:about' %}" class="hover:text-white transition-colors">About Us</a>
                <a href="{% url 'products:list' %}" class="hover:text-white transition-colors">Products</a>
                <a href="{% url 'pages:quality_process' %}" class="hover:text-white transition-colors">Quality & Process</a>
                <a href="{% url 'pages:services' %}" class="hover:text-white transition-colors">Sourcing Services</a>
                <a href="{% url 'pages:faq' %}" class="hover:text-white transition-colors">FAQ</a>
                <a href="{% url 'pages:contact' %}" class="hover:text-white transition-colors">Contact</a>
            </nav>

            <!-- Primary RFQ Action -->
            <div class="hidden md:flex items-center space-x-4">
                <a href="{% url 'rfq:submit' %}" class="metallic-silver-btn px-5 py-2.5 rounded text-xs uppercase tracking-widest font-semibold flex items-center space-x-2 shadow-sm">
                    <span>Request Quote</span>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </a>
            </div>

            <!-- Mobile Hamburger Button -->
            <div class="flex lg:hidden">
                <button id="mobile-menu-btn" type="button" class="p-2 rounded text-slate-400 hover:text-white hover:bg-slate-800 focus:outline-none" aria-label="Toggle navigation">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Drawer -->
    <div id="mobile-menu-drawer" class="hidden lg:hidden bg-[#1E2328] border-b border-[#353B44] px-4 pt-2 pb-6 space-y-3">
        <a href="{% url 'pages:home' %}" class="block py-2 text-sm font-medium text-slate-300 hover:text-white border-b border-slate-800/60">Home</a>
        <a href="{% url 'pages:about' %}" class="block py-2 text-sm font-medium text-slate-300 hover:text-white border-b border-slate-800/60">About Us</a>
        <a href="{% url 'products:list' %}" class="block py-2 text-sm font-medium text-slate-300 hover:text-white border-b border-slate-800/60">Products Catalogue</a>
        <a href="{% url 'pages:quality_process' %}" class="block py-2 text-sm font-medium text-slate-300 hover:text-white border-b border-slate-800/60">Quality & Process</a>
        <a href="{% url 'pages:services' %}" class="block py-2 text-sm font-medium text-slate-300 hover:text-white border-b border-slate-800/60">Sourcing Services</a>
        <a href="{% url 'pages:faq' %}" class="block py-2 text-sm font-medium text-slate-300 hover:text-white border-b border-slate-800/60">FAQ</a>
        <a href="{% url 'pages:contact' %}" class="block py-2 text-sm font-medium text-slate-300 hover:text-white border-b border-slate-800/60">Contact Export Desk</a>
        <div class="pt-2">
            <a href="{% url 'rfq:submit' %}" class="block w-full text-center metallic-silver-btn py-3 rounded text-xs uppercase tracking-wider font-semibold">Request Quotation (RFQ)</a>
        </div>
    </div>
</header>
