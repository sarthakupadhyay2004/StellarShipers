<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Access Restricted | STELLAR SHIPERS</title>
    <meta name="robots" content="noindex, nofollow">
    <script>
        (function() {
            var theme = localStorage.getItem('stellar_theme') || 'light';
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="h-full bg-slate-50 dark:bg-[#0B0F17] flex flex-col justify-center py-12 sm:px-6 lg:px-8 text-slate-800 dark:text-slate-200 antialiased">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <img src="/static/img/logo.png" alt="Stellar Shipers" class="h-10 w-auto mx-auto object-contain">
        <div class="mt-6 p-8 bg-white dark:bg-[#111827] border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm">
            <span class="inline-flex items-center px-2.5 py-1 rounded text-xs font-mono font-bold bg-rose-100 dark:bg-rose-950/80 text-rose-800 dark:text-rose-300 border border-rose-300 dark:border-rose-800">
                HTTP 403: ACCESS RESTRICTED
            </span>
            <h2 class="mt-4 text-xl font-bold text-slate-900 dark:text-white">
                Staff Credentials Required
            </h2>
            <p class="mt-2 text-xs font-mono text-slate-500 dark:text-slate-400 leading-relaxed">
                You are currently logged in as <span class="text-slate-900 dark:text-white font-bold">{{ request.user.username }}</span>. This account does not possess staff or administrator access rights for the Operations Dashboard.
            </p>
            <div class="mt-6 flex flex-col sm:flex-row items-center justify-center gap-3 font-mono text-xs">
                <a href="{% url 'dashboard:logout' %}" class="w-full sm:w-auto px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white transition-colors">
                    Log Out & Switch User
                </a>
                <a href="{% url 'pages:home' %}" class="w-full sm:w-auto px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 transition-colors">
                    Public Website
                </a>
            </div>
        </div>
    </div>
</body>
</html>
